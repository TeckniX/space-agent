[build]
builder = "DOCKERFILE"

[deploy]
startCommand = ["/docker-entrypoint.sh"]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on-failure"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

requiredMountPath = "/data/customware"

[variables]
CUSTOMWARE_PATH ="/data/customware"

[[mount]]
mountPath = "/data/customware"